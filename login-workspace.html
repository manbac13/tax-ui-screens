<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acurat — Choose a workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/acurat.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="workspace">
<main class="auth">
  <div class="auth-card wide">
    <div class="auth-top">
      <div class="auth-brand"><img src="assets/acurat-wordmark.svg" alt="Acurat"><span>Trusted Automation. Smarter Assurance</span></div>
      <div class="auth-head" style="gap:8px">
        <h1>Choose a workspace</h1><p>Pick a workspace to continue.</p>
        <div class="center" style="margin-top:4px"><span class="echip"><i id="emailChipAv" aria-hidden="true"></i><span id="emailChipText"></span></span></div>
      </div>
    </div>

    <div class="ws-list" id="wsList" aria-label="Workspaces"></div>

    <div class="center"><button type="button" class="alink" id="diffEmail"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Use a different email</button></div>
  </div>
</main>
<template id="tplArrow"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></template>
<script src="assets/auth.js"></script>
</body>
</html>

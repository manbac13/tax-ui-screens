<script src="assets/portal.js"></script>
<script>
/* Questionnaire tab, client view (ui_screens sections/Questionnaire.js → ClientQuestionnaire):
   same layout as the firm Questionnaire tab (summary card, then one card per section), but every
   question takes an answer: Yes / No / Not sure, plus optional details on Yes. Answers save as they're
   given; Submit answers sends the finished questionnaire to the preparer. */
(function(){
  var A=window.Acurat,P=window.Portal,esc=P.esc,preparer=P.TAXPAYER.firm.preparer.split(' ')[0];
  var root=document.getElementById('qRoot');
  var CARD='border: 1px solid #E5E7EB; border-radius: 12px; background: #FFFFFF;';
  var PILL='display: inline-flex; align-items: center; gap: 6px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; font-size: 13px; line-height: 16px; font-weight: 500; white-space: nowrap;';
  var TONE={sent:['Sent','border: 1px solid #E2E8F0; background: #F8FAFC; color: #334155;'],prog:['In progress','border: 1px solid #FED7AA; background: #FFF7ED; color: #B45309;'],done:['Submitted','border: 1px solid #BBF7D0; background: #F0FDF4; color: #15803D;']};
  var PRI='height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border: 0; border-radius: 999px; background: #2F7D3B; font-size: 14px; line-height: 20px; font-weight: 600; color: #FFFFFF; white-space: nowrap;';
  var CH_ON='height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFE3D3; background: #E3F1E5; font-size: 14px; font-weight: 600; color: #1F6A2E;';
  var CH_OFF='height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2E8F0; background: #F1F5F9; font-size: 14px; font-weight: 400; color: #334155;';
  var CHOICES=[['yes','Yes'],['no','No'],['unsure','Not sure']];

  function render(){
    var ret=P.current(),data=ret&&ret.questionnaire;
    if(!data){
      root.innerHTML='<section style="'+CARD+' padding: 24px;"><div class="empty-st"><b>No questionnaire for this return</b><span>'+esc(preparer)+' hasn’t sent you any questions for this return. If they do, they’ll show up here.</span></div></section>';
      return;
    }
    var all=P.questionsOf(data),answered=all.filter(function(q){return q.answer;}).length,allDone=answered===all.length;
    var st=data.submitted?TONE.done:answered?TONE.prog:TONE.sent,pct=Math.round(answered/Math.max(all.length,1)*100);
    var meta=['Sent '+data.sent+' by '+preparer,all.length+' questions',data.submitted?'Submitted '+data.submitted:'Answers save as you go'].join(' · ');
    var h='<section style="'+CARD+' padding: 24px; display: flex; flex-direction: column; gap: 16px;">'+
      '<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px;">'+
        '<div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;"><h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; color: #111827;">'+esc(data.title)+'</h2><span style="'+PILL+' '+st[1]+'">'+st[0]+'</span></div>'+
        '<span style="font-size: 14px; line-height: 20px; font-weight: 400; color: #64748B;">'+esc(meta)+'</span></div>'+
        (data.submitted?'':'<button type="button" id="qSubmit" class="tb pri"'+(allDone?'':' disabled title="Answer every question to submit"')+'>Submit answers</button>')+
      '</div>'+
      '<div style="display: flex; align-items: center; gap: 16px;"><div style="flex: 1;"><div role="progressbar" aria-label="Questions answered" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" style="height: 10px; border-radius: 10px; background: #E2E8F0;"><div style="width: '+pct+'%; height: 10px; border-radius: 10px; background: #5CC08A;"></div></div></div>'+
      '<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #111827; white-space: nowrap;">'+answered+' of '+all.length+' answered</span></div></section>';
    // One card, one numbered list — no sections
    h+='<section style="'+CARD+' overflow: hidden;"><ol style="margin: 0; padding: 0; list-style: none;">'+
        all.map(function(q,i){
          var last=i===all.length-1;
          return '<li data-q="'+q.id+'" style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; padding: 16px 24px;'+(last?'':' border-bottom: 1px solid #F0F1F3;')+'">'+
            '<span style="font-size: 14px; line-height: 20px; color: #64748B; font-variant-numeric: tabular-nums;">'+(i+1)+'.</span>'+
            '<div style="display: flex; flex-direction: column; min-width: 0;"><span id="qt'+q.id+'" style="font-size: 14px; line-height: 20px; font-weight: 500; color: #111827;">'+esc(q.text)+'</span>'+
              (q.help?'<span style="font-size: 13px; line-height: 20px; color: #64748B;">'+esc(q.help)+'</span>':'')+'</div>'+
            '<div role="group" aria-labelledby="qt'+q.id+'" style="display: flex; gap: 8px;">'+CHOICES.map(function(c){var on=q.answer===c[0];return '<button type="button" data-ans="'+c[0]+'" aria-pressed="'+on+'" style="'+(on?CH_ON:CH_OFF)+'">'+c[1]+'</button>';}).join('')+'</div>'+
            (q.answer==='yes'?'<div style="grid-column: 2 / -1;"><textarea class="tq-ta" data-det="'+q.id+'" rows="2" aria-label="Details for question '+q.id+'" placeholder="Anything we should know? (optional)">'+esc(q.details||'')+'</textarea></div>':'')+
            (q.answer==='unsure'?'<span style="grid-column: 2 / -1; font-size: 12px; line-height: 16px; color: #64748B;">That’s fine. Your preparer will follow up.</span>':'')+
          '</li>';
        }).join('')+'</ol></section>';
    root.innerHTML=h;
  }

  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-ans]');
    if(b){var id=+b.closest('[data-q]').dataset.q;P.answer(id,{answer:b.dataset.ans});render();P.refreshBadge();
      var nb=root.querySelector('[data-q="'+id+'"] [data-ans="'+b.dataset.ans+'"]');if(nb)nb.focus();return;}
    if(e.target.closest('#qSubmit')){
      P.submitQuestionnaire();render();P.refreshBadge();A.toast('Thanks — your answers are with '+preparer+'.');
    }
  });
  root.addEventListener('focusout',function(e){
    var t=e.target;if(!t.matches||!t.matches('[data-det]'))return;
    var id=+t.dataset.det,q=P.questionsOf(P.current().questionnaire).filter(function(x){return x.id===id;})[0];
    if(q&&t.value!==(q.details||''))P.answer(id,{details:t.value});
  });

  render();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acurat — Set password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/acurat.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="set">
<main class="auth">
  <div class="auth-card">

    <!-- ?mode=invite → "Welcome aboard" copy; anything else → reset copy -->
    <div id="v-form" style="display:flex;flex-direction:column;gap:24px">
      <div class="auth-top">
        <div class="auth-brand"><img src="assets/acurat-wordmark.svg" alt="Acurat"><span>Trusted Automation. Smarter Assurance</span></div>
        <div class="auth-head"><h1 id="heading">Choose a new password</h1><p id="sub">Pick something you haven’t used before — at least 8 characters.</p></div>
      </div>
      <form class="auth-form" id="setForm" novalidate>
        <div class="fld" data-field="password">
          <label for="set-new">New password</label>
          <div class="inp">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input id="set-new" type="password" placeholder="At least 8 characters" autocomplete="new-password" autofocus>
            <button type="button" class="eye" data-eye="set-new" aria-label="Show password" title="Show password"><svg class="i-eye" hidden aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-eyeoff" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 8 10 8a18 18 0 0 1-2.2 3.2"/><path d="M6.6 6.6A18 18 0 0 0 2 12s3.6 8 10 8a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg></button>
          </div>
          <p class="ferr" id="set-new-err" role="alert" hidden></p>
        </div>
        <div class="fld" data-field="confirm">
          <label for="set-confirm">Confirm password</label>
          <div class="inp">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input id="set-confirm" type="password" placeholder="Type it again" autocomplete="new-password">
            <button type="button" class="eye" data-eye="set-confirm" aria-label="Show password" title="Show password"><svg class="i-eye" hidden aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-eyeoff" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 8 10 8a18 18 0 0 1-2.2 3.2"/><path d="M6.6 6.6A18 18 0 0 0 2 12s3.6 8 10 8a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg></button>
          </div>
          <p class="ferr" id="set-confirm-err" role="alert" hidden></p>
        </div>
        <button class="abtn" id="setSubmit" type="submit"><span id="submitLabel">Update password</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
        <div class="center"><a class="alink" href="login.html"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Back to sign in</a></div>
      </form>
    </div>

    <!-- Success -->
    <div id="v-done" hidden style="display:flex;flex-direction:column;gap:24px">
      <div class="auth-brand"><img src="assets/acurat-wordmark.svg" alt="Acurat"><span>Trusted Automation. Smarter Assurance</span></div>
      <div class="note ok" role="status"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><div><b id="doneTitle">Password updated</b><span id="doneBody">Your password was reset successfully. You can now sign in with the new one.</span></div></div>
      <a class="abtn" href="login.html">Go to sign in<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></a>
    </div>

  </div>
</main>
<script src="assets/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-portal="taxpayer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acurat — Your returns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font-family:inherit;cursor:pointer}
.sr-top{background:#fff;border-bottom:1px solid #E5E7EB}
.sr-top .in{max-width:1040px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.sr-top img{height:24px;display:block}
.sr-me{display:flex;align-items:center;gap:12px}
.sr-me .av{width:30px;height:30px;border-radius:50%;background:#E3F1E5;color:#1F6A2E;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sr-me b{font-size:14px;font-weight:600;color:#111827}
.sr-body{max-width:1040px;margin:0 auto;padding:32px 24px 40px;display:flex;flex-direction:column;gap:32px}
.sr-h h1{margin:0;font-size:24px;line-height:32px;font-weight:800;letter-spacing:-.4px;color:#0B1220}
.sr-h p{margin:4px 0 0;font-size:14px;line-height:20px;color:#64748B}
.sr-sec{display:flex;flex-direction:column;gap:12px}
.sr-sec>h2{margin:0;font-size:16px;line-height:24px;font-weight:600;color:#64748B}
.sr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sr-grid.one{grid-template-columns:1fr}
.rc{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:150px;box-sizing:border-box}
.rc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rc .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc .tx i{font-style:normal;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;color:#64748B}
.rc .tx h3{margin:0;font-size:18px;line-height:28px;font-weight:700;color:#111827}
.rc .tx span{font-size:14px;line-height:20px;color:#64748B}
.rc .bot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.rc .bot small{font-size:12px;color:#64748B}
@media (max-width:760px){.sr-grid{grid-template-columns:1fr}.sr-me b{display:none}.sr-top .in,.sr-body{padding-left:16px;padding-right:16px}}
</style>
<script src="assets/guard.js"></script>
<link rel="stylesheet" href="assets/acurat.css">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<header class="sr-top">
  <div class="in">
    <a href="portal-select.html" aria-label="Acurat home"><img src="assets/acurat-wordmark.svg" alt="Acurat"></a>
    <div class="sr-me">
      <span class="av" id="meAv" aria-hidden="true"></span><b id="meName"></b>
      <button type="button" class="tb sec" id="logout"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Log out</button>
    </div>
  </div>
</header>

<main class="sr-body">
  <div class="sr-h"><h1 id="welcome"></h1><p id="welcomeSub"></p></div>
  <section class="sr-sec" aria-labelledby="yr"><h2 id="yr"></h2><div class="sr-grid" id="grid"></div></section>
</main>

<script src="assets/acurat.js"></script>
<script src="assets/portal.js"></script>
<script>
/* Select a return: first screen after a taxpayer signs in (ui_screens pages/portal/SelectReturn.js). */
(function(){
  var P=window.Portal, T=P.TAXPAYER, list=P.engagements(), esc=P.esc;
  var $=function(id){return document.getElementById(id);};
  var arrow='<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';
  var single=list.length===1;
  $('meAv').textContent=T.name.split(' ').map(function(p){return p[0];}).slice(0,2).join('');
  $('meName').textContent=T.name;
  $('welcome').textContent='Welcome back, '+T.firstName;
  $('welcomeSub').textContent=single?"Here's your return for this year and where things stand.":"Choose a return to see what's needed and where things stand.";
  $('yr').textContent=Math.max.apply(null,list.map(function(e){return e.year;}))+' returns';
  $('grid').classList.toggle('one',single);
  $('grid').innerHTML=list.map(function(e){
    var n=P.todosOf(e).length;
    return '<article class="rc"><div class="top"><div class="tx"><i>TAX YEAR '+e.year+' · '+esc(e.kind.toUpperCase())+'</i><h3>'+esc(e.title)+'</h3><span>'+esc(e.form)+'</span></div>'+
      (n?'<span class="tpill warn">'+n+' to do</span>':'<span class="tpill">Nothing to do</span>')+'</div>'+
      '<div class="bot"><small>Last activity '+esc(e.lastActivity)+'</small><button type="button" class="tb '+(n?'pri':'sec')+'" data-open="'+e.id+'">Open return'+arrow+'</button></div></article>';
  }).join('');
  $('grid').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-open]');if(!b)return;
    P.select(b.getAttribute('data-open'));location.href='portal-todo.html';
  });
  $('logout').addEventListener('click',function(){
    P.clearSelection();
    try{var s=JSON.parse(localStorage.getItem('acurat.auth'))||{};s.signedIn=false;s.schema=null;s.portal=null;localStorage.setItem('acurat.auth',JSON.stringify(s));}catch(e){}
    location.replace('login.html');
  });
})();
</script>
</body>
</html>

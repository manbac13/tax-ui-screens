<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acurat — Enter password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/acurat.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="password">
<main class="auth">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-brand"><img src="assets/acurat-wordmark.svg" alt="Acurat"><span>Trusted Automation. Smarter Assurance</span></div>
      <div class="auth-head"><h1 id="title">Sign in to your workspace</h1><p>Enter your password to sign in.</p></div>
    </div>

    <form class="auth-form" id="form" novalidate>
      <div class="ws-sum">
        <span class="wav indigo" id="wsAv" aria-hidden="true"></span>
        <span class="wtx"><b id="wsName"></b><span id="wsEmail"></span></span>
        <a class="alink sm" id="change" href="login-workspace.html">Change</a>
      </div>

      <div class="fld" data-field="password">
        <label for="password">Password</label>
        <div class="inp">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
          <button type="button" class="eye" data-eye="password" aria-label="Show password" title="Show password"><svg class="i-eye" hidden aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-eyeoff" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 8 10 8a18 18 0 0 1-2.2 3.2"/><path d="M6.6 6.6A18 18 0 0 0 2 12s3.6 8 10 8a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg></button>
        </div>
        <p class="ferr" id="password-err" role="alert" hidden></p>
      </div>

      <div class="row-end"><a class="alink" href="forgot-password.html">Forgot password?</a></div>

      <button class="abtn" id="submit" type="submit">Sign in<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
    </form>
  </div>
</main>
<script src="assets/auth.js"></script>
</body>
</html>

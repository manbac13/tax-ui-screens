<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acurat — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/acurat.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="email">
<main class="auth">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-brand"><img src="assets/acurat-wordmark.svg" alt="Acurat"><span>Trusted Automation. Smarter Assurance</span></div>
      <div class="auth-head"><h1>Sign in to your account</h1><p>Enter your work email to find your workspaces.</p></div>
    </div>

    <div class="flash" id="flash" role="status" hidden><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><span id="flashText"></span></div>

    <form class="auth-form" id="form" novalidate>
      <div class="fld" data-field="email">
        <label for="email">Work email</label>
        <div class="inp">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="email" name="email" type="email" placeholder="you@firm.com" autocomplete="username" autofocus>
        </div>
        <p class="ferr" id="email-err" role="alert" hidden></p>
      </div>

      <button class="abtn" id="submit" type="submit">Continue<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>

      <p class="muted">Need access? Ask your firm administrator to invite you.</p>
    </form>
  </div>
</main>
<script src="assets/auth.js"></script>
</body>
</html>
